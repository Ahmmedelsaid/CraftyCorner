<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Crafty Corner</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6efe3" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // بنظبط اللغة والاتجاه قبل ما Angular يشتغل، عشان ما يبقاش فيه وميض RTL/LTR.
      // لازم نفس منطق LanguageService.
      (function () {
        try {
          var lang = localStorage.getItem('craftycorner.lang');
          if (lang !== 'ar' && lang !== 'en') {
            lang = 'ar';
          }
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
