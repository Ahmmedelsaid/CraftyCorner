name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (test and build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx ng test --no-watch
      - run: npx ng build customer
      - run: npx ng build admin

  api:
    name: API (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build api --configuration Release
      - run: dotnet test api.tests --configuration Release

  docker:
    name: Docker image (build, smoke test and browser tests)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: craftycorner
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t craftycorner .
      - name: Start it against MySQL
        run: |
          docker run -d --name craftycorner --network host \
            -e PORT=5034 \
            -e "ConnectionStrings__Default=Server=127.0.0.1;Port=3306;Database=craftycorner;User=root;Password=ci-only" \
            -e Jwt__Key=ci-only-key-0123456789-abcdefghijklmnopqrstuvwxyz \
            -e Database__MigrateOnStartup=true \
            -e Seed__DemoData=true \
            -e Seed__AdminEmail=e2e-admin@example.com \
            -e Seed__AdminPassword=Passw0rd!1 \
            -e RateLimit__AuthPermitLimit=500 \
            craftycorner
          for i in $(seq 1 60); do curl -fsS http://localhost:5034/api/health && break; sleep 2; done
      - name: Smoke test
        run: |
          curl -fsS http://localhost:5034/api/health
          curl -fsS http://localhost:5034/ | grep -q "<app-root"
          curl -fsS http://localhost:5034/products/1 | grep -q "<app-root"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5034/api/does-not-exist)" = "404"
          curl -fsS "http://localhost:5034/api/products?pageSize=1" | grep -Eq '"totalCount":[1-9][0-9]*'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the browser tests
        run: |
          npm ci
          npx ng build admin
          npx playwright install --with-deps chromium
      - name: Browser tests (shop, map, phone and dashboard, in a real browser)
        env:
          E2E_BASE_URL: http://localhost:5034
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: Passw0rd!1
          E2E_START_ADMIN: "1"
          E2E_API_ORIGIN: http://localhost:5034
        run: npx playwright test -c e2e
      - name: Upload the browser test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Container logs (on failure)
        if: failure()
        run: docker logs craftycorner
